services:
  - type: web
    name: fintrack-server
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USERS
        sync: false

  - type: worker
    name: fintrack-bot
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python fintrack_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USERS
        sync: false
      - key: SERVER_URL
        sync: false